name: nRF7002 West Build

on:
  # Trigger on push to main branches
  push:
    branches:
      - nRF-WiFi
      - main

  # Trigger on pull request
  pull_request:
    branches:
      - nRF-WiFi
      - main

jobs:
  build:
    name: Build nRF7002 Firmware
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: nrftest-testing

      # Step 2 - Install system dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools \
            python3-tk python3-wheel xz-utils file make \
            gcc gcc-multilib g++-multilib libsdl2-dev \
            libmagic1

      # Step 3 - Install West tool
      - name: Install West
        run: pip3 install west

      # Step 4 - Verify West installation
      - name: Verify West Version
        run: west --version

      # Step 5 - Install nRF Connect SDK v3.0.0 using West
      - name: Initialise nRF Connect SDK
        run: |
          mkdir -p ncs
          cd ncs
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.0.0
          west update
          west zephyr-export

      # Step 6 - Install Python requirements for Zephyr and nRF SDK
      - name: Install Python Requirements
        run: |
          pip3 install -r ncs/zephyr/scripts/requirements.txt
          pip3 install -r ncs/nrf/scripts/requirements.txt
          pip3 install -r ncs/bootloader/mcuboot/scripts/requirements.txt

      # Step 7 - Install Zephyr SDK toolchain
      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64.tar.xz
          tar xf zephyr-sdk-0.16.8_linux-x86_64.tar.xz
          cd zephyr-sdk-0.16.8
          ./setup.sh -t arm-zephyr-eabi -h -c

      # Step 8 - Verify ARM toolchain
      - name: Verify ARM Toolchain
        run: arm-zephyr-eabi-gcc --version

      # Step 9 - Build firmware using West + Sysbuild
      - name: Build nRF7002 Firmware
        run: |
          cd ncs
          west build -b nrf7002dk/nrf5340/cpuapp \
            ../nrftest-testing/CNR-Joyastic \
            --sysbuild \
            -d ../nrftest-testing/CNR-Joyastic/build \
            -- -DCONFIG_WIFI=y

      # Step 10 - Upload firmware artifacts
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf7002-firmware
          path: |
            nrftest-testing/CNR-Joyastic/build/merged.hex
            nrftest-testing/CNR-Joyastic/build/zephyr/zephyr.elf
            nrftest-testing/CNR-Joyastic/build/zephyr/zephyr.bin
          retention-days: 7
