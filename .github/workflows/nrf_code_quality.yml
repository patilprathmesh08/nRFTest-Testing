name: nRF7002 CI Pipeline

on:
  push:
    branches:
      - nRF-WiFi
      - main
  pull_request:
    branches:
      - nRF-WiFi
      - main

jobs:
  # ─── JOB 1: BUILD FIRMWARE ──────────────────────────────────────────────────
  build:
    name: Build nRF7002 Firmware
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: nrftest-testing

      # Step 2 - Install system dependencies
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake ninja-build gperf \
            ccache dfu-util device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools \
            python3-tk python3-wheel xz-utils file make \
            gcc gcc-multilib g++-multilib libsdl2-dev \
            libmagic1

      # Step 3 - Install West tool
      - name: Install West
        run: pip3 install west

      # Step 4 - Verify West version
      - name: Verify West Version
        run: west --version

      # Step 5 - Install Zephyr SDK v0.17.0
      - name: Install Zephyr SDK
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64.tar.xz
          tar xf zephyr-sdk-0.17.0_linux-x86_64.tar.xz -C $HOME
          cd $HOME/zephyr-sdk-0.17.0
          ./setup.sh -t arm-zephyr-eabi -h -c
          echo "$HOME/zephyr-sdk-0.17.0/arm-zephyr-eabi/bin" >> $GITHUB_PATH

      # Step 6 - Verify ARM toolchain
      - name: Verify ARM Toolchain
        run: arm-zephyr-eabi-gcc --version

      # Step 7 - Initialise nRF Connect SDK v3.3.0
      - name: Initialise nRF Connect SDK v3.3.0
        run: |
          mkdir -p ncs
          cd ncs
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.3.0
          west update
          west zephyr-export

      # Step 8 - Install Python requirements
      - name: Install Python Requirements
        run: |
          pip3 install -r ncs/zephyr/scripts/requirements.txt
          pip3 install -r ncs/nrf/scripts/requirements.txt
          pip3 install -r ncs/bootloader/mcuboot/scripts/requirements.txt

      # Step 9 - Build nRF7002 firmware using West + Sysbuild
      - name: Build nRF7002 Firmware
        run: |
          cd ncs
          west build -b nrf7002dk/nrf5340/cpuapp/ns \
            ../nrftest-testing/CNR-Joyastic \
            --sysbuild \
            -d ../nrftest-testing/CNR-Joyastic/build

      # Step 10 - Show memory usage
      - name: Show Memory Usage
        run: |
          echo "=== Application Core Memory Usage ==="
          size nrftest-testing/CNR-Joyastic/build/CNR-Joyastic/zephyr/zephyr.elf || true
          echo "=== Network Core Memory Usage ==="
          size nrftest-testing/CNR-Joyastic/build/ipc_radio/zephyr/zephyr.elf || true

      # Step 11 - List all build output files
      - name: List Build Output Files
        run: |
          echo "=== Build output files ==="
          find nrftest-testing/CNR-Joyastic/build -name "*.hex" -o -name "*.elf" -o -name "*.bin" | sort

      # Step 12 - Upload ALL firmware artifacts
      # Flash order on board:
      # 1. merged_CPUNET.hex first (network core - ipc_radio)
      # 2. merged.hex second (application core)
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf7002-firmware
          path: |
            nrftest-testing/CNR-Joyastic/build/merged_CPUNET.hex
            nrftest-testing/CNR-Joyastic/build/merged.hex
            nrftest-testing/CNR-Joyastic/build/CNR-Joyastic/zephyr/zephyr.elf
            nrftest-testing/CNR-Joyastic/build/CNR-Joyastic/zephyr/zephyr.bin
          retention-days: 7

      # Step 13 - Add flashing instructions as build summary
      - name: Add Flash Instructions to Summary
        run: |
          echo "## Flash Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Flash in this exact order using nRF Connect Programmer:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Step 1** - Flash network core first:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "merged_CPUNET.hex" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Step 2** - Flash application core:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "merged.hex" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ─── JOB 2: CODE QUALITY CHECKS ─────────────────────────────────────────────
  # Runs in parallel with build job
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2 - Install Doxygen
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # ─── CHECK 1: HEADER AND COPYRIGHT NOTICE (WARNING ONLY) ────────────────
      - name: Check File Headers and Copyright Notice
        run: |
          echo "Checking copyright headers in CNR-Joyastic/src/ only..."
          MISSING=0
          while IFS= read -r file; do
            if ! grep -q "Copyright\|copyright\|LICENSE\|license\|Author\|author\|SPDX" "$file"; then
              echo "WARNING - MISSING HEADER: $file"
              MISSING=$((MISSING + 1))
            fi
          done < <(find CNR-Joyastic/src -name "*.c" -o -name "*.h" 2>/dev/null)
          if [ "$MISSING" -gt 0 ]; then
            echo "---"
            echo "WARNING: $MISSING file(s) in src/ are missing copyright/header notice."
            echo "This is a warning only - build will continue."
          else
            echo "PASSED: All files in src/ have copyright/header notice."
          fi

      # ─── CHECK 2: DOXYGEN DOCUMENTATION CHECK (WARNING ONLY) ────────────────
      - name: Setup Doxyfile
        working-directory: CNR-Joyastic
        run: |
          if [ ! -f Doxyfile ]; then
            echo "No Doxyfile found, generating default..."
            doxygen -g Doxyfile
            sed -i 's/PROJECT_NAME           = "My Project"/PROJECT_NAME           = "CNR-Joyastic"/' Doxyfile
            sed -i 's|INPUT                  =|INPUT                  = src|' Doxyfile
            sed -i 's/RECURSIVE              = NO/RECURSIVE              = YES/' Doxyfile
            sed -i 's/EXTRACT_ALL            = NO/EXTRACT_ALL            = YES/' Doxyfile
          fi

      - name: Run Doxygen Check
        working-directory: CNR-Joyastic
        run: |
          echo "Running Doxygen..."
          doxygen Doxyfile 2>&1 | tee doxygen_output.log
          WARNINGS=$(grep -c "warning:" doxygen_output.log || true)
          echo "---"
          echo "Doxygen Warnings: $WARNINGS"
          if [ "$WARNINGS" -gt 0 ]; then
            echo "WARNING: $WARNINGS Doxygen warning(s) found - please review doxygen_output.log"
            echo "This is a warning only - build will continue."
          else
            echo "PASSED: No Doxygen warnings found."
          fi

      - name: Upload Doxygen Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrf-doxygen-log
          path: CNR-Joyastic/doxygen_output.log
          retention-days: 7

      # ─── CHECK 3: SONARCLOUD SCAN ────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: CNR-Joyastic
          args: >
            -Dsonar.organization=patilprathmesh08
            -Dsonar.projectKey=patilprathmesh08_nRFTest-Testing
            -Dsonar.sources=src
            -Dsonar.inclusions=**/*.c,**/*.h
            -Dsonar.c.file.suffixes=.c
            -Dsonar.h.file.suffixes=.h
            -Dsonar.exclusions=**/build/**,**/boards/**,**/child_image/**,**/sysbuild/**
            -Dsonar.qualitygate.wait=false
