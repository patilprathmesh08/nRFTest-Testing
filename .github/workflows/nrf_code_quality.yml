name: nRF7002 CI Pipeline

on:
  push:
    branches:
      - nRF-WiFi
      - main
  pull_request:
    branches:
      - nRF-WiFi
      - main

jobs:
  # ─── JOB 1: BUILD FIRMWARE ──────────────────────────────────────────────────
  build:
    name: Build nRF7002 Firmware
    runs-on: self-hosted

    steps:
      # Step 1 - Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: nrftest-testing

      # Step 2 - Build nRF7002 firmware using West + Sysbuild
      # nRF Connect SDK v3.3.0 already installed on Windows PC via VS Code
      - name: Build nRF7002 Firmware
        shell: cmd
        run: |
          call "%USERPROFILE%\ncs\v3.3.0\zephyr\zephyr-env.cmd"
          west build -b nrf7002dk/nrf5340/cpuapp/ns ^
            %GITHUB_WORKSPACE%\nrftest-testing\CNR-Joyastic ^
            --sysbuild ^
            -d %GITHUB_WORKSPACE%\nrftest-testing\CNR-Joyastic\build

      # Step 3 - List all build output files
      - name: List Build Output Files
        shell: powershell
        run: |
          echo "=== Build output files ==="
          Get-ChildItem -Path nrftest-testing\CNR-Joyastic\build -Recurse -Include *.hex,*.elf,*.bin

      # Step 4 - Upload ALL firmware artifacts
      # Flash order on board:
      # 1. merged_CPUNET.hex first (network core - ipc_radio)
      # 2. Reset board
      # 3. merged.hex second (application core)
      # 4. Reset board
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf7002-firmware
          path: |
            nrftest-testing\CNR-Joyastic\build\merged_CPUNET.hex
            nrftest-testing\CNR-Joyastic\build\merged.hex
          retention-days: 7

      # Step 5 - Add flashing instructions as build summary
      - name: Add Flash Instructions to Summary
        shell: powershell
        run: |
          echo "## Flash Instructions" >> $env:GITHUB_STEP_SUMMARY
          echo "Flash in this exact order using nRF Connect Programmer:" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 1** - Flash network core first: merged_CPUNET.hex" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 2** - Reset board" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 3** - Flash application core: merged.hex" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 4** - Reset board" >> $env:GITHUB_STEP_SUMMARY

  # ─── JOB 2: CODE QUALITY CHECKS ─────────────────────────────────────────────
  code-quality:
    name: Code Quality Checks
    runs-on: self-hosted

    steps:
      # Step 1 - Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── CHECK 1: HEADER AND COPYRIGHT NOTICE (WARNING ONLY) ────────────────
      # Only checks CNR-Joyastic/src/ folder
      - name: Check File Headers and Copyright Notice
        shell: powershell
        run: |
          echo "Checking copyright headers in CNR-Joyastic/src/ only..."
          $missing = 0
          Get-ChildItem -Path CNR-Joyastic\src -Recurse -Include *.c,*.h | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -notmatch "Copyright|copyright|LICENSE|license|Author|author|SPDX") {
              echo "WARNING - MISSING HEADER: $($_.FullName)"
              $missing++
            }
          }
          if ($missing -gt 0) {
            echo "WARNING: $missing file(s) missing copyright/header notice."
            echo "This is a warning only - build will continue."
          } else {
            echo "PASSED: All files have copyright/header notice."
          }

      # ─── CHECK 2: DOXYGEN DOCUMENTATION CHECK (WARNING ONLY) ────────────────
      # Doxygen must be installed on Windows PC
      - name: Setup Doxyfile
        shell: powershell
        working-directory: CNR-Joyastic
        run: |
          if (-not (Test-Path Doxyfile)) {
            echo "No Doxyfile found, generating default..."
            doxygen -g Doxyfile
            (Get-Content Doxyfile) -replace 'PROJECT_NAME           = "My Project"', 'PROJECT_NAME           = "CNR-Joyastic"' | Set-Content Doxyfile
            (Get-Content Doxyfile) -replace 'INPUT                  =', 'INPUT                  = src' | Set-Content Doxyfile
            (Get-Content Doxyfile) -replace 'RECURSIVE              = NO', 'RECURSIVE              = YES' | Set-Content Doxyfile
            (Get-Content Doxyfile) -replace 'EXTRACT_ALL            = NO', 'EXTRACT_ALL            = YES' | Set-Content Doxyfile
          }

      - name: Run Doxygen Check
        shell: powershell
        working-directory: CNR-Joyastic
        run: |
          echo "Running Doxygen..."
          doxygen Doxyfile 2>&1 | Tee-Object -FilePath doxygen_output.log
          $warnings = (Select-String -Path doxygen_output.log -Pattern "warning:").Count
          echo "Doxygen Warnings: $warnings"
          if ($warnings -gt 0) {
            echo "WARNING: $warnings Doxygen warning(s) found."
            echo "This is a warning only - build will continue."
          } else {
            echo "PASSED: No Doxygen warnings found."
          }

      - name: Upload Doxygen Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrf-doxygen-log
          path: CNR-Joyastic\doxygen_output.log
          retention-days: 7

      # ─── CHECK 3: SONARCLOUD SCAN ────────────────────────────────────────────
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: CNR-Joyastic
          args: >
            -Dsonar.organization=patilprathmesh08
            -Dsonar.projectKey=patilprathmesh08_nRFTest-Testing
            -Dsonar.sources=src
            -Dsonar.inclusions=**/*.c,**/*.h
            -Dsonar.c.file.suffixes=.c
            -Dsonar.h.file.suffixes=.h
            -Dsonar.exclusions=**/build/**,**/boards/**,**/child_image/**,**/sysbuild/**
            -Dsonar.qualitygate.wait=false
