name: nRF7002 CI Pipeline

on:
  push:
    branches:
      - nRF-WiFi
      - main
  pull_request:
    branches:
      - nRF-WiFi
      - main

# ===== SETTINGS: change values here only =====
env:
  PROJECT_DIR: CNR-CNT                        # Project folder inside the repo
  NCS_VERSION: v3.3.0                         # nRF Connect SDK version installed on runner
  BOARD: nrf7002dk/nrf5340/cpuapp             # Board target
  NRFUTIL: nrfutil                            # If not on PATH, give full path to nrfutil.exe
  WORK_DIR: C:\Workspace\nRFTest-Testing      # Short path on C: drive (avoids long path issues)
  OUTPUT_DIR: C:\Workspace\build_output       # Final hex files are collected here

jobs:
  # ===== JOB 1: BUILD FIRMWARE =====
  build:
    name: Build nRF7002 Firmware
    runs-on: self-hosted

    steps:
      # Step 1 - Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: nrftest-testing

      # Step 2 - Copy project source to C: drive
      # robocopy exit codes 0 to 7 mean success, 8 or more mean failure
      - name: Copy Source to C Drive
        shell: powershell
        run: |
          $src = "$env:GITHUB_WORKSPACE\nrftest-testing\$env:PROJECT_DIR"
          $dst = "$env:WORK_DIR\$env:PROJECT_DIR"
          if (-not (Test-Path $src)) {
            echo "ERROR: Source folder not found: $src"
            exit 1
          }
          robocopy $src $dst /MIR /XD build* .git .vscode /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { echo "ERROR: robocopy failed"; exit 1 }
          echo "Source copied to $dst"
          exit 0

      # Step 3 - Build with west using the nRF Connect SDK toolchain
      - name: Build nRF7002 Firmware
        shell: powershell
        run: |
          $src   = "$env:WORK_DIR\$env:PROJECT_DIR"
          $build = "$env:WORK_DIR\build"
          & $env:NRFUTIL sdk-manager toolchain launch --ncs-version $env:NCS_VERSION -- west build -p always -b $env:BOARD -d $build --sysbuild $src
          if ($LASTEXITCODE -ne 0) { echo "ERROR: west build failed"; exit 1 }

      # Step 4 - Collect hex files into one output folder
      - name: Collect Firmware Files
        shell: powershell
        run: |
          $build = "$env:WORK_DIR\build"
          $out   = $env:OUTPUT_DIR
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          New-Item -ItemType Directory -Path $out | Out-Null

          # merged hex files at build root (if sysbuild generated them)
          Get-ChildItem -Path $build -Filter "merged*.hex" -File | Copy-Item -Destination $out

          # zephyr.hex of each image, named after its image folder
          Get-ChildItem -Path $build -Recurse -Filter "zephyr.hex" -File | ForEach-Object {
            $image = $_.Directory.Parent.Name
            Copy-Item $_.FullName -Destination "$out\${image}_zephyr.hex"
          }

          echo "Files collected:"
          Get-ChildItem $out | ForEach-Object { echo " - $($_.Name)" }
          if ((Get-ChildItem $out -Filter *.hex).Count -eq 0) {
            echo "ERROR: No hex files found after build"
            exit 1
          }

      # Step 5 - Upload firmware artifacts
      # Flash order on board:
      # 1. Network core hex first (merged_CPUNET.hex)
      # 2. Reset board
      # 3. Application core hex second (merged.hex)
      # 4. Reset board
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf7002-firmware
          path: C:\Workspace\build_output\*.hex
          if-no-files-found: error
          retention-days: 7

      # Step 6 - Add flashing instructions as build summary
      - name: Add Flash Instructions to Summary
        shell: powershell
        run: |
          echo "## Flash Instructions" >> $env:GITHUB_STEP_SUMMARY
          echo "Flash in this exact order using nRF Connect Programmer:" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 1** - Flash network core first: merged_CPUNET.hex" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 2** - Reset board" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 3** - Flash application core: merged.hex" >> $env:GITHUB_STEP_SUMMARY
          echo "**Step 4** - Reset board" >> $env:GITHUB_STEP_SUMMARY

  # ===== JOB 2: CODE QUALITY CHECKS =====
  code-quality:
    name: Code Quality Checks
    runs-on: self-hosted

    steps:
      # Step 1 - Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== CHECK 1: HEADER AND COPYRIGHT NOTICE (WARNING ONLY) =====
      - name: Check File Headers and Copyright Notice
        shell: powershell
        run: |
          echo "Checking copyright headers in CNR-CNT/src/ only..."
          $missing = 0
          Get-ChildItem -Path CNR-CNT\src -Recurse -Include *.c,*.h | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -notmatch "Copyright|copyright|LICENSE|license|Author|author|SPDX") {
              echo "WARNING - MISSING HEADER: $($_.FullName)"
              $missing++
            }
          }
          if ($missing -gt 0) {
            echo "WARNING: $missing file(s) missing copyright/header notice."
            echo "This is a warning only - build will continue."
          } else {
            echo "PASSED: All files have copyright/header notice."
          }

      # ===== CHECK 2: DOXYGEN DOCUMENTATION CHECK (WARNING ONLY) =====
      - name: Setup Doxyfile
        shell: powershell
        working-directory: CNR-CNT
        run: |
          if (-not (Test-Path Doxyfile)) {
            echo "No Doxyfile found, generating default..."
            doxygen -g Doxyfile
            (Get-Content Doxyfile) -replace 'PROJECT_NAME           = "My Project"', 'PROJECT_NAME           = "CNR-CNT"' | Set-Content Doxyfile
            (Get-Content Doxyfile) -replace 'INPUT                  =', 'INPUT                  = src' | Set-Content Doxyfile
            (Get-Content Doxyfile) -replace 'RECURSIVE              = NO', 'RECURSIVE              = YES' | Set-Content Doxyfile
            (Get-Content Doxyfile) -replace 'EXTRACT_ALL            = NO', 'EXTRACT_ALL            = YES' | Set-Content Doxyfile
          }

      - name: Run Doxygen Check
        shell: powershell
        working-directory: CNR-CNT
        run: |
          echo "Running Doxygen..."
          doxygen Doxyfile 2>&1 | Tee-Object -FilePath doxygen_output.log
          $warnings = (Select-String -Path doxygen_output.log -Pattern "warning:").Count
          echo "Doxygen Warnings: $warnings"
          if ($warnings -gt 0) {
            echo "WARNING: $warnings Doxygen warning(s) found."
            echo "This is a warning only - build will continue."
          } else {
            echo "PASSED: No Doxygen warnings found."
          }

      - name: Upload Doxygen Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nrf-doxygen-log
          path: CNR-CNT\doxygen_output.log
          retention-days: 7

  
