# ---------------- Wi-Fi network ----------------
# The SSID below is the one the router actually BROADCASTS. Note it is NOT
# the "TP-Link_A078_5G" printed on the router label: that name is never on
# the air, because the router (TP-Link Archer AX12, AX1500 Wi-Fi 6, region
# IN/1.8) has SMART CONNECT / band steering enabled, which merges both
# radios under a SINGLE SSID. A dual-band scan from the board shows:
#
#   TP-Link_A078   2.4GHz  ch10    -24 dBm  WPA2-PSK
#   TP-Link_A078   5GHz    ch149   -32 dBm  WPA2-PSK   <-- the 5 GHz radio
#
# and no "_5G" SSID anywhere. Configuring the label name gives
# WIFI_STATUS_CONN_AP_NOT_FOUND (status 4) forever, since no such network
# exists to associate with.
#
# So the SSID below is the same string a 2.4 GHz client would use, but this
# build still lands on 5 GHz: src/wifi_net.c pins
# params.band = WIFI_FREQ_BAND_5_GHZ, which steers the association to the
# 5 GHz radio of that shared SSID. DO NOT read the SSID as meaning 2.4 GHz.
# If you ever point this at a 2.4 GHz-only SSID you MUST change that band
# too, or the board scans the wrong band forever and looks like a dead
# network.
#
# Channel 149 is UNII-3, NOT a DFS channel, so there is no radar-scan delay
# and no DFS association restriction to worry about - one less variable.
# CONFIG_WIFI_CREDENTIALS_STATIC_SSID="TP-Link_A078"
# CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="55697521"

# Alternatives, kept for reference. NOTE: the first is 2.4 GHz and needs
# the band change in src/wifi_net.c described above.
# CONFIG_WIFI_CREDENTIALS_STATIC_SSID="TP-Link_A078"
# CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="55697521"
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="Pinetics Deco"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="Pinetics@135"

# Regulatory domain. MUST be set for 5 GHz to work: under the default "00"
# (world/generic) the nRF70 treats most 5 GHz channels as passive-scan-only
# and will NOT associate on them, regardless of the SSID. "IN" enables the
# channels permitted in India, matching the router's IN/1.8 region.
#
# CONFIG_NRF_WIFI_ALL_BAND=y comes from the nRF70 driver defaults, so the
# hardware side needs no change; the reg domain is the only gate.
CONFIG_NRF70_REG_DOMAIN="IN"

CONFIG_WIFI_CREDENTIALS_STATIC_TYPE_PSK=y
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y
CONFIG_JSON_LIBRARY=y
CONFIG_HTTP_CLIENT=y
CONFIG_BT=n

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
# Log level 3 = INFO. Full logging: boot progress, "Connected", "DHCP
# bound", "NTP sync OK", "TLS connected" and the two per-frame lines.
#
# THE SEND RATE AND THIS SETTING ARE COUPLED - check the arithmetic before
# raising either. The sender emits about 230 bytes per frame and the
# console is 115200 8N1 = 11520 B/s, so with CONFIG_LOG_MODE_IMMEDIATE=y
# (which shifts those bytes out synchronously, in the calling thread):
#
#     rate     UART load     console utilisation
#      10 Hz    2300 B/s      20 %   <- current, comfortable
#      50 Hz   11500 B/s      99.8 % <- saturated; send times balloon
#     100 Hz   23000 B/s     200 %   <- impossible, 2x oversubscribed
#
# At saturation the UART, not the radio, becomes the bottleneck and
# ws_send_frame() blocks for hundreds of milliseconds. If you need a
# faster rate than this, first raise the console baud, drop
# CONFIG_LOG_MODE_IMMEDIATE, or log every Nth frame.
#
# Set to 2 (warnings and errors only) to take the console off the critical
# path entirely - but note a healthy board then looks identical to a hung
# one, so diagnosis moves to SWD.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ADC=y

CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_POSIX_TIMERS=y

CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
# ---------------- mDNS (.local) name resolution ----------------
# The WSS/NTP host is an i.MX8MP running Avahi and is reached by its
# mDNS name "verdin-imx8mp.local" (see WSS_HOST in src/https_conn.c)
# instead of a hardcoded IP, so a DHCP address change on that box does
# not need a firmware rebuild.
#
# DNS_RESOLVER is needed even though there is no unicast DNS server here:
# Zephyr routes .local queries through the same resolver, just to the mDNS
# multicast address instead of a DNS server.
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y

# NOT optional despite both DNS_SERVERn strings below being left empty.
# zephyr/subsys/net/lib/dns/resolve.c:dns_resolve_init_default() only
# builds a server list - and therefore only registers the 224.0.0.251:5353
# mDNS pseudo-server - inside #if defined(CONFIG_DNS_SERVER_IP_ADDRESSES).
# With this =n the resolver initialises with zero servers and every
# .local lookup fails with EAI_FAIL. The empty CONFIG_DNS_SERVER1 slot is
# skipped harmlessly ("Empty server name", resolve.c:626).
CONFIG_DNS_SERVER_IP_ADDRESSES=y

# Required to actually RECEIVE the reply. dns_postprocess_server() joins
# the 224.0.0.251 group via net_ipv4_igmp_join(); without IGMP that call
# returns -ENOTSUP, the group is never added to the interface, and
# Avahi's multicast response is dropped by the IP stack.
CONFIG_NET_IPV4_IGMP=y

# One DNS query at a time is all this application ever issues.
CONFIG_DNS_RESOLVER_MAX_SERVERS=1
CONFIG_DNS_NUM_CONCUR_QUERIES=1
# Per-attempt timeout. Kept at the Zephyr default and named explicitly
# because https_conn.c's 5 s retry cadence is measured from the START of
# an attempt, so this value is part of that budget (see RESOLVE_RETRY_MS).
CONFIG_NET_SOCKETS_DNS_TIMEOUT=2000
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=80
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_NET_TC_TX_COUNT=1

CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5

# ---------------- Network connection contexts ----------------
# MUST be raised above the Zephyr default of 4, which is one short and
# makes EVERY periodic NTP resync fail with:
#     <err> net_conn: Not enough connection contexts.
#     <err> net_sntp: Cannot connect to UDP remote : 2
#     <err> epoch: NTP sync with verdin-imx8mp.local failed (-2)
#
# The handler budget at 4:
#     DHCPv4 client (UDP :68)              1  permanent
#     mDNS resolver (224.0.0.251:5353)     1  permanent
#     TLS/TCP socket to the Verdin         1  permanent once connected
#     ------------------------------------------------------------
#     free                                 1
# but an SNTP resync needs TWO at once - one to resolve the .local name
# and one for the UDP socket to the NTP server itself.
#
# The symptom is deceptive: the BOOT sync works and only the resyncs fail.
# epoch_sync_now() runs BEFORE https_conn_open() in main(), so at boot the
# TCP handler is not taken yet and 2 are free. Once TLS connects, only 1
# ever is. The giveaway in the log is the failure spacing - exactly
# NTP_RESYNC_INTERVAL_S apart.
#
# It fails silently in the data rather than stopping anything: left at
# epoch-0 the board reports utc=[1970-01-01 ...] in every frame.
#
# Set to 8 rather than the strictly-needed 5: a reconnect can register the
# new TCP handler before the old one is released, which is precisely when
# this would bite again. MEASURED cost is 64 bytes of RAM per handler, so
# the extra headroom is 256 B - which matters at ~98.4 % RAM. FLASH is
# unchanged.
CONFIG_NET_MAX_CONN=8
CONFIG_NET_CONTEXT_SYNC_RECV=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_SOCKETS_POLL_MAX=6

# The board gets its address via DHCP (CONFIG_NET_DHCPV4 above) rather than
# a static IP - the commented-out lines below are kept only as a fallback
# reference in case a deployment ever needs a fixed address again; if so,
# it MUST match whatever network the board is actually joining.


# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.0.230"
# CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.0.1"


# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.40.230"
# CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.40.1"

CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000



CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096

CONFIG_SHELL_CMDS_RESIZE=n

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# mTLS client-cert auth means the board also does an ECDSA SIGN operation
# during handshake (proving it owns client_private_key), not just verifying
# the server's cert - this needs more MPI scratch space than a smaller heap
# provides (too small shows as "TLS handshake error: -0x10" /
# MBEDTLS_ERR_MPI_ALLOC_FAILED).
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_PEM_PARSE_C=y

# CONFIG_NRF_SECURITY and CONFIG_MBEDTLS_TLS_LIBRARY are intentionally not
# set directly here - NCS v3.4.0's Mbed TLS 4.x / TF-PSA-Crypto makes both
# derived-only symbols with no prompt, so assigning them is a hard CMake
# Kconfig error. CONFIG_MBEDTLS_LEGACY_CRYPTO_C, CONFIG_MBEDTLS_ECDH_C,
# CONFIG_MBEDTLS_USE_PSA_CRYPTO, and CONFIG_MBEDTLS_KEY_EXCHANGE_ECDH_ECDSA_ENABLED
# no longer exist as symbols at all in this NCS version. Everything they
# used to enable is still pulled in automatically by NET_SOCKETS_SOCKOPT_TLS
# and the PSA_WANT_* selections below.
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
# Board provisions only client cert + client private key - no CA cert, so
# it does not verify server identity.
CONFIG_NET_SOCKETS_TLS_MAX_CREDENTIALS=2

CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_PK_C=y

CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_POSIX_API=y

CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_POSIX_API=y
# ---------------- TFLite replay ----------------
# Replays the customer harness's recorded joystick trajectory
# (controller_data_log.csv columns joystick_x / joystick_y, 1151 rows)
# in place of the live ADC, so the downstream TFLite model gets a known,
# repeatable input. The JSON frame keeps exactly the same 13 fields.
#
# DISABLED (08-10-2026) so the board sends LIVE joystick ADC readings to the
# base station. Uncomment the line below to go back to replaying the
# recorded trajectory; replay_data.c is then compiled in again (see
# target_sources_ifdef in CMakeLists.txt).
#
# Costs about 13.8 KB of FLASH and ZERO RAM - deliberate, because RAM is
# at roughly 98.3 % with only ~7.4 KB free.
# CONFIG_DEBUG_TFLITE=y

# Wrap to row 0 after the last sample rather than freezing on it, so a
# soak test runs unattended. Set to n for a single clean pass. Note the
# wrap is a step discontinuity in the trajectory - discard the frames
# either side of the seam when comparing against reference output.
CONFIG_DEBUG_TFLITE_LOOP=y

# Sampler/send period while replaying. 100 ms = 10 Hz. One full 1151-row
# pass takes about 115 s at this rate.
#
# THIS RATE MATCHES NEITHER REFERENCE, so do not use it for a filtered
# output comparison:
#   - The harness's example.py assumes CONTROL_TS = 0.02 s (50 Hz), which
#     is the filter time constant its reference output was produced with.
#     Set 20 here to line up with that.
#   - The recording itself averages 24.97 ms between samples (about
#     40 Hz), with wide jitter from 0.36 ms to 52.74 ms. Set 25 here to
#     approximate the real spacing.
# The model's INPUT window is unaffected either way - see the pacing
# caveat in src/replay_data.h for why.
#
# CONSOLE BUDGET: at 10 Hz the sender's ~230 bytes per frame cost
# 2300 B/s of a 11520 B/s console, i.e. 20 % utilisation - comfortable,
# and the reason full INFO logging is viable at this rate. See the table
# under CONFIG_LOG_DEFAULT_LEVEL before raising this: 50 Hz saturates the
# console and 100 Hz is twice oversubscribed.
CONFIG_DEBUG_TFLITE_PERIOD_MS=100

# ---------------- Send trigger ----------------
# The SEND_TRIGGER choice in Kconfig keeps all three behaviours available
# as compiled-out alternatives, switchable from this file alone:
#
#   CONFIG_SEND_TRIGGER_CONTINUOUS=y    stream every sampler period
#   CONFIG_SEND_TRIGGER_BUTTON_HOLD=y   stream only while held
#   CONFIG_SEND_TRIGGER_BUTTON_PRESS=y  ONE frame per press
#
# Exactly one may be set; it is a Kconfig choice, so setting a second is a
# build error rather than a silent surprise. With CONTINUOUS selected,
# src/button.c is not compiled in at all (see CMakeLists.txt).
#
# SELECTED: one frame per press. Each debounced press of the DK's
# silkscreen "Button 1" sends exactly one frame. HOLDING the button does
# NOT repeat - only the rising edge counts - so release and press again
# for the next frame.
#
# NOTE the button numbering trap: the DT node NAMED button1 is silkscreen
# "Button 2". This uses sw0 / button0, which is silkscreen "Button 1".
#
# NOTE for replay comparisons: a press advances the recorded trajectory by
# exactly one row, so the pass stays complete and in order - but it is no
# longer evenly spaced in time. Use CONFIG_SEND_TRIGGER_CONTINUOUS when
# comparing filtered model output against the harness reference
# (see src/replay_data.h).
# SELECTED: continuous. A "frame send frequency" only exists in this mode
# - under BUTTON_PRESS the rate is however fast someone presses the
# button, and CONFIG_DEBUG_TFLITE_PERIOD_MS only governs button polling.
# Switch the line below to CONFIG_SEND_TRIGGER_BUTTON_PRESS=y to go back
# to one-frame-per-press.
CONFIG_SEND_TRIGGER_CONTINUOUS=y

# ---------------- Wi-Fi survey scan ----------------
# Diagnostic. Logs every AP the nRF7002 can see - band, channel, RSSI,
# security - immediately before the association attempt, and says whether
# the configured SSID was among them.
#
# Turn this on whenever association fails with Connection failed (4),
# i.e. WIFI_STATUS_CONN_AP_NOT_FOUND: it distinguishes "that SSID is not
# on the air" from "it is there and association itself failed". The
# nRF7002 is dual-band and is often the only instrument to hand that can
# see a 5 GHz network at all.
#
# TURN THIS OFF once the network question is settled: it costs up to 20 s
# of boot time and a burst of UART traffic on an already-saturated console.
# DISABLED - it has done its job and costs up to 20 s of boot delay.
# Re-enable when a Wi-Fi association problem needs investigating; its AP
# table is logged with LOG_INF, so CONFIG_LOG_DEFAULT_LEVEL must be 3.
# CONFIG_WIFI_SURVEY_SCAN=y
